name: Edge function repair

on:
  workflow_dispatch:
    inputs:
      function_slug:
        description: Edge Function slug from the approved registry
        required: true
        type: string
      requested_by:
        description: Telegram operator requesting the repair
        required: false
        type: string
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: edge-function-repair
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: ajvlcamxemgbxduhiqrl

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate target and repair missing runtime blob
        id: repair
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REQUESTED_SLUG: ${{ inputs.function_slug }}
        shell: bash
        run: |
          set -euo pipefail
          APPROVED="dupr-sync errors-telegram-alert mux-sync-assets news-rewrite ops-edge-health ops-job-control ops-job-digest ops-news-worker pro-tour-trigger-scrape zalo-token-refresh"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case " $APPROVED " in *" $REQUESTED_SLUG "*) TARGETS="$REQUESTED_SLUG" ;; *) echo "Unapproved function: $REQUESTED_SLUG"; exit 2 ;; esac
          else
            TARGETS="$APPROVED"
          fi
          REPAIRED=""
          for fn in $TARGETS; do
            BODY=$(curl -sS --max-time 10 "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/${fn}" || true)
            if ! grep -q 'NOT_FOUND_FUNCTION_BLOB' <<<"$BODY"; then echo "$fn runtime blob is present"; continue; fi
            echo "Repairing missing blob for $fn"
            if ! supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --use-api; then
              supabase functions delete "$fn" --project-ref "$SUPABASE_PROJECT_REF" --yes
              supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --use-api
            fi
            VERIFY=$(curl -sS --max-time 15 "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/${fn}" || true)
            if grep -q 'NOT_FOUND_FUNCTION_BLOB' <<<"$VERIFY"; then echo "Runtime blob still missing: $fn"; exit 1; fi
            REPAIRED="${REPAIRED:+$REPAIRED }$fn"
          done
          echo "repaired=$REPAIRED" >> "$GITHUB_OUTPUT"
      - name: Notify Telegram
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPAIRED: ${{ steps.repair.outputs.repaired }}
          REQUESTED_SLUG: ${{ inputs.function_slug }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then exit 0; fi
          if [ "${{ job.status }}" = "success" ]; then
            if [ -n "$REPAIRED" ]; then MSG="✅ Edge Function $REQUESTED_SLUG đã được redeploy và probe thành công."; else MSG="✅ Edge Function $REQUESTED_SLUG đang hoạt động; không cần redeploy."; fi
          else
            MSG="❌ Không thể tự phục hồi Edge Function $REQUESTED_SLUG. Log: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null || true

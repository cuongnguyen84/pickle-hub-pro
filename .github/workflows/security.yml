name: Security

# Phase 3E — dependency + static security scanning.
#   - npm audit: ADVISORY (report-only). The dep tree carries pre-existing
#     advisories; a hard gate would block every PR. Surfaces high/critical
#     so they're visible; flip continue-on-error off once the backlog is
#     triaged to make it a real gate.
#   - CodeQL: GitHub's static analysis for JS/TS. Reports findings to the
#     repo Security tab.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # weekly, Mondays 03:00 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci
      - name: npm audit (high + critical, advisory)
        continue-on-error: true
        run: |
          echo "### npm audit (high+critical)" >> "$GITHUB_STEP_SUMMARY"
          npm audit --audit-level=high | tee audit.txt || true
          # Surface a compact count in the job summary.
          npm audit --audit-level=high --json 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const v=j.metadata?.vulnerabilities||{};console.log(`high=${v.high||0} critical=${v.critical||0} total=${v.total||0}`)}catch{console.log("audit parse skipped")}})' \
            >> "$GITHUB_STEP_SUMMARY" || true

  codeql:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      # 2026-07-21 (plan A, approved by Cuong): GitHub pulled code-scanning
      # SARIF upload for private repos on the free plan — the upload step
      # started failing with "Code scanning is not enabled for this
      # repository" and Settings no longer offers enabling it without the
      # paid Code Security add-on. CodeQL still RUNS in full; we gate on the
      # SARIF locally instead of uploading. Net effect: the gate got
      # STRONGER — findings now fail this job directly (upload-only never
      # did), they just no longer appear in the Security tab.
      - name: Perform CodeQL analysis (no upload — GHAS not available)
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          upload: never
          output: codeql-results

      - name: Gate on CodeQL findings (local SARIF)
        run: |
          node -e '
            const fs = require("fs");
            const dir = "codeql-results";
            const files = fs.readdirSync(dir).filter(f => f.endsWith(".sarif"));
            if (files.length === 0) { console.error("no SARIF produced — analysis step broken"); process.exit(1); }
            let total = 0;
            for (const f of files) {
              const sarif = JSON.parse(fs.readFileSync(`${dir}/${f}`, "utf8"));
              for (const run of sarif.runs ?? []) {
                for (const r of run.results ?? []) {
                  total++;
                  console.log(`[${r.level ?? "warning"}] ${r.ruleId}: ${r.message?.text?.slice(0, 160) ?? ""}`);
                  const loc = r.locations?.[0]?.physicalLocation;
                  if (loc) console.log(`    ${loc.artifactLocation?.uri}:${loc.region?.startLine}`);
                }
              }
            }
            if (total > 0) { console.error(`\n${total} CodeQL finding(s) — failing (repo policy: zero findings since 2026-07-18)`); process.exit(1); }
            console.log("CodeQL: 0 findings");
          '

      - name: Upload SARIF artifact (inspection without Security tab)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results/
          retention-days: 30

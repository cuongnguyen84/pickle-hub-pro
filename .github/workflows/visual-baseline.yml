name: Visual baseline (capture)

# Manual one-button capture of the TheLine visual-regression baselines.
# Run this once (and again after an intentional design change) to seed/refresh
# the committed snapshot PNGs that the "Visual regression" PR job diffs against.
#
# Captures with Playwright's --update-snapshots and commits the result back to
# the branch it ran on.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL to capture baselines from"
        default: "https://www.thepicklehub.net"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  capture:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Capture baselines
        env:
          VISUAL: "1"
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
        run: npx playwright test --project=visual --project=visual-mobile --update-snapshots
      - name: Commit baselines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual.spec.ts-snapshots 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git commit -m "test(visual): update TheLine baselines"
          # Direct push to a protected branch (main) is rejected (GH006 —
          # run 29692578668). Push to the branch we ran on when possible;
          # otherwise open a PR from a throwaway branch.
          if git push 2>/dev/null; then
            echo "Baselines committed to $GITHUB_REF_NAME."
          else
            BR="chore/visual-baselines-${{ github.run_number }}"
            git switch -c "$BR"
            git push -u origin "$BR"
            gh pr create --fill --title "test(visual): refresh baselines (run ${{ github.run_number }})" \
              --body "Automated baseline refresh from the Visual baseline (capture) workflow. Review the PNG diffs, then merge."
            echo "Protected branch — opened a PR from $BR instead."
          fi

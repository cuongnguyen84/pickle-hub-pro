name: Deploy guard

# After a push to main, guard against the two "code in source != deployed"
# traps from CLAUDE.md:
#   1. An edge function changed in the repo but never `supabase functions
#      deploy`-ed  -> auto-deploy the changed functions.
#   2. A migration file committed but never applied to prod -> drift check.
# Both alert Telegram on failure.
#
# Required GitHub secrets:
#   SUPABASE_ACCESS_TOKEN   Management API PAT (functions deploy + drift query)
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID   (optional) failure alerts
#
# verify_jwt is governed per-function by supabase/config.toml — we do NOT pass
# --no-verify-jwt here so the committed config stays the source of truth.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-guard-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ajvlcamxemgbxduhiqrl

jobs:
  deploy-guard:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A direct push can contain multiple commits. Fetch the full span so
          # function changes in an earlier commit are not silently skipped.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Detect changed edge functions
        id: changed
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          BASE="$PUSH_BEFORE"
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD -- 'supabase/functions/**')
          echo "Changed paths:"; echo "$CHANGED"
          if echo "$CHANGED" | grep -q '^supabase/functions/_shared/'; then
            # Shared helpers changed — every consumer bundle may now be stale,
            # so redeploy ALL functions (defends the exact drift this guards).
            echo "→ _shared changed: redeploying ALL functions"
            FNS=$(ls -d supabase/functions/*/ \
              | sed 's#supabase/functions/##; s#/$##' \
              | grep -v '^_shared$' | sort -u | tr '\n' ' ')
          else
            # Only touched function directories that still exist. A deleted
            # function is handled explicitly (or manually) and must not be
            # passed to `supabase functions deploy` with a missing entrypoint.
            CANDIDATES=$(echo "$CHANGED" \
              | sed -nE 's#^supabase/functions/([^/]+)/.*#\1#p' \
              | grep -v '^_shared$' | sort -u)
            FNS=""
            for fn in $CANDIDATES; do
              if [ -f "supabase/functions/$fn/index.ts" ]; then
                FNS="${FNS:+$FNS }$fn"
              else
                echo "→ skipping removed function: $fn"
              fi
            done
          fi
          echo "functions=$FNS" >> "$GITHUB_OUTPUT"
          echo "To deploy: ${FNS:-<none>}"

      - name: Deploy changed edge functions
        if: steps.changed.outputs.functions != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          for fn in ${{ steps.changed.outputs.functions }}; do
            echo "::group::Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
            echo "::endgroup::"
          done

      - name: Self-heal functions the GitHub integration deploys blob-less
        # The Supabase GitHub integration ("Deploy to production") re-deploys
        # the WHOLE function fleet on every main merge and (since ~2026-07-22)
        # registers metadata WITHOUT uploading code blobs → every call 404s
        # NOT_FOUND_FUNCTION_BLOB. On 2026-07-22 18:45Z this took down all
        # ~73 functions (auth email, OTP, payments, webhooks) for ~6h.
        # Until the integration is disabled in the Supabase dashboard:
        # sweep every function and, if ANY serves blob-404, redeploy the
        # whole fleet (idempotent, ~2 min). Wait first — the integration
        # deploy lands up to ~2 min after the push that triggered this run.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          sleep 120
          BROKEN=""
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            [ "$fn" = "_shared" ] && continue
            [ -f "supabase/functions/$fn/index.ts" ] || continue
            BODY=$(curl -sS --max-time 10 "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/$fn" || true)
            if echo "$BODY" | grep -q "NOT_FOUND_FUNCTION_BLOB"; then
              BROKEN="${BROKEN:+$BROKEN }$fn"
            fi
          done
          if [ -z "$BROKEN" ]; then
            echo "All functions serve a blob — nothing to heal"
            exit 0
          fi
          echo "::warning::Blob-less functions detected: $BROKEN — redeploying ALL"
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
          # Verify the heal actually took.
          sleep 10
          for fn in $BROKEN; do
            BODY=$(curl -sS --max-time 10 "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/$fn" || true)
            if echo "$BODY" | grep -q "NOT_FOUND_FUNCTION_BLOB"; then
              echo "::error::$fn still blob-less after redeploy"; exit 1
            fi
          done
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            MSG="🩹 deploy-guard self-healed blob-less edge functions after Supabase integration deploy: ${BROKEN}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" > /dev/null || true
          fi
        continue-on-error: false

      - name: Migration drift check (strict — SEC-06)
        # The ledger was fully reconciled 2026-07-16 (283 = 283, zero drift)
        # and every Management-API-applied migration is now ledgered in the
        # same session (docs/ops-runbook.md §1). Strict fails on drift in
        # either direction: repo-ahead (merged but never applied) or
        # db-ahead (dashboard/hotfix SQL unknown to the repo).
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DRIFT_STRICT: "1"
        run: node scripts/check-migration-drift.mjs

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets missing — skipping alert"; exit 0
          fi
          MSG="🛡️ *Deploy guard FAILED on main*%0A%0A"
          MSG="$MSG*Commit:* \`${GITHUB_SHA:0:7}\`%0A"
          MSG="$MSG*Run:* https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}%0A"
          MSG="$MSG_An edge function failed to deploy._"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" -d "text=${MSG}" \
            -d "parse_mode=Markdown" -d "disable_web_page_preview=true" > /dev/null

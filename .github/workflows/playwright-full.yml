name: Playwright full (auth + journeys + contract)

# Audit 2026-08-09: the auth (7), journeys (10) and contract (3) suites were
# written but never wired into CI — playwright.yml only runs e2e:smoke.
#
# Budget math (Actions minutes are a scarce resource here — two depletion
# incidents in 07/2026): one run ≈ npm ci 2' + suites ~10' ≈ 12 min (browsers
# come from the pinned Playwright container image since 2026-10-23 — no more
# apt install step). Weekly schedule = ~55 min/month. Deliberately NOT on
# pull_request/push — that would be ~12 min × every PR sync. Escalate to a
# path-filtered PR trigger only if a weekly cadence proves too slow to catch
# regressions.
#
# Read-only-ish against production: auth-setup mints test sessions via the
# service-role helper (same secrets the smoke workflow already uses).

on:
  schedule:
    # Monday 21:00 UTC = Tuesday 04:00 VN — quietest traffic window.
    - cron: "0 21 * * 1"
  workflow_dispatch:

concurrency:
  group: playwright-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Resolve the exact Playwright version the repo pins BEFORE the full job,
  # because `container:` cannot read step outputs from the same job — and an
  # unpinned/floating image is exactly the flake this replaces. Same pattern
  # as playwright.yml (2026-10-23).
  resolve-playwright:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 22, exactly — same supabase-js/WebSocket constraint as playwright.yml.
          node-version: 22
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Resolve Playwright version
        id: resolve
        run: echo "version=$(npx playwright --version | sed 's/Version //')" >> "$GITHUB_OUTPUT"

  full:
    needs: resolve-playwright
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # The official image ships the pinned browsers + their system libraries
    # under /ms-playwright. This removes the apt step entirely — the ubuntu
    # mirror timeouts that chronically flaked `playwright install --with-deps`
    # (same failure class fixed for the smoke workflow in PR #913).
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.resolve-playwright.outputs.version }}-noble

    env:
      PLAYWRIGHT_BASE_URL: https://www.thepicklehub.net

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 22, exactly — same supabase-js/WebSocket constraint as playwright.yml.
          node-version: 22
          cache: npm

      - name: Install npm deps
        run: npm ci

      # auth/journeys/contract all run on Desktop Chrome only — chromium is
      # already in the container image, no install step needed.

      - name: Run auth + journeys + contract suites
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLAYWRIGHT_ORGANIZER_CLUB_SLUG: ${{ secrets.PLAYWRIGHT_ORGANIZER_CLUB_SLUG }}
        run: npx playwright test --project=auth --project=journeys --project=contract

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-report
          path: playwright-report/
          retention-days: 2

      # Telegram step removed 2026-10-20: failures of this workflow are reported in the
      # Grok Bot digest (08:00/21:00 Asia/Saigon), which reads `gh run list` on the Mac.

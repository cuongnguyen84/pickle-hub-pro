name: pgTAP

# Runs the pgTAP database regression suite (supabase/tests/*.test.sql) against
# a throwaway local Supabase Postgres built from the migration files. This is a
# REAL gate: `supabase db start` applies every migration from scratch, so a
# broken migration OR a failing pgTAP assertion turns the job red. No live DB,
# no secrets — nothing to silently skip.

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/qa/**"
      - "scripts/schema-catalog*"
      - "scripts/sql/schema-catalog-snapshot.sql"
      - ".github/workflows/pgtap.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/qa/**"
      - "scripts/schema-catalog*"
      - "scripts/sql/schema-catalog-snapshot.sql"
      - ".github/workflows/pgtap.yml"
  workflow_dispatch:

concurrency:
  group: pgtap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pgtap:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Fail loudly if there are no pgTAP tests to run
        # Guards against a silent green when the suite is accidentally emptied
        # or the glob stops matching.
        run: |
          count=$(ls supabase/tests/*.test.sql 2>/dev/null | wc -l | tr -d ' ')
          echo "Found $count pgTAP test file(s)."
          if [ "$count" -eq 0 ]; then
            echo "::error::No supabase/tests/*.test.sql files — nothing to test."
            exit 1
          fi

      - name: Start local Postgres from migrations
        run: supabase db start

      - name: Test catalog comparison and capture clean replay before tests
        env:
          PGHOST: 127.0.0.1
          PGPORT: "54322"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
          SCHEMA_SOURCE_SHA: ${{ github.sha }}
        run: |
          node --test scripts/schema-catalog.node-test.mjs
          node scripts/schema-catalog.mjs replay schema-replay.json

      - name: Upload SHA-pinned clean catalog snapshot
        uses: actions/upload-artifact@v4
        with:
          name: schema-replay-${{ github.sha }}
          path: schema-replay.json
          retention-days: 7

      - name: Run pgTAP suite
        run: supabase test db --local supabase/tests

      - name: Run concurrency race harness (QA-03)
        # pgTAP can't exercise real races (single transaction); this fires the
        # DB-01 capacity RPCs from two parallel psql sessions against the same
        # disposable database and requires exactly one winner per round.
        run: node scripts/qa/db-race.mjs

      - name: Run atomic IndexNow budget race
        # Separate sessions queue behind a coordinator, then compete for slot10.
        # No production credentials; default disposable replay database only.
        run: node scripts/qa/indexnow-budget-race.mjs

      - name: Run verified registration renewal proof race
        run: node scripts/qa/registration-renewal-race.mjs

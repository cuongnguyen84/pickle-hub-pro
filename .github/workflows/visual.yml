name: Visual regression

# Phase TheLine — advisory pixel-diff of key pages against committed baselines.
# ADVISORY (continue-on-error): a diff is reported + artifacts uploaded, but
# never blocks merge — live data (scores, news) makes hard-gating flaky.
# Self-skips until baselines exist (run the "Visual baseline (capture)"
# workflow once to seed them).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Resolve the exact Playwright version the repo pins BEFORE the visual job,
  # because `container:` cannot read step outputs from the same job — and an
  # unpinned/floating image is exactly the flake this replaces. Same pattern
  # as playwright.yml (2026-10-23). The resolve job mirrors this workflow's
  # own node pin (20).
  resolve-playwright:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Resolve Playwright version
        id: resolve
        run: echo "version=$(npx playwright --version | sed 's/Version //')" >> "$GITHUB_OUTPUT"

  visual:
    needs: resolve-playwright
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # The official image ships the pinned browsers + their system libraries
    # under /ms-playwright. This removes the apt step entirely — the ubuntu
    # mirror timeouts that chronically flaked `playwright install --with-deps`
    # (same failure class fixed for the smoke workflow in PR #913). The
    # baseline gate step also runs inside the container; it only lists files,
    # so the have=0 path costs one container boot and nothing else changes.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.resolve-playwright.outputs.version }}-noble
    steps:
      - uses: actions/checkout@v7

      - name: Check for committed baselines
        id: gate
        run: |
          if ls tests/visual.spec.ts-snapshots/*.png >/dev/null 2>&1; then
            echo "have=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No committed baselines — run the 'Visual baseline (capture)' workflow first. Skipping."
            echo "have=0" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.have == '1'
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        if: steps.gate.outputs.have == '1'
        run: npm ci
      # Chromium is already in the container image — no install step needed.

      - name: Point at PR preview if available
        if: steps.gate.outputs.have == '1' && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        run: |
          BRANCH="${{ github.head_ref }}"
          SLUG=$(echo "$BRANCH" | tr '[:upper:]/.' '[:lower:]---')
          # Cloudflare truncates preview aliases to 28 chars (and trims trailing
          # dashes) — without this, long branch names 404 and we silently fall
          # back to testing production instead of the preview (2026-07-22).
          SLUG=$(echo "$SLUG" | cut -c1-28 | sed 's/-*$//')
          PREVIEW="https://${SLUG}.pickle-hub-pro.pages.dev"
          # 2026-10-24: the step shell runs with -e, so a single transient
          # curl failure (SSL error 35 seen 4x on the #929 branch while the
          # preview itself answered 200) used to kill the whole step at
          # once. Tolerate probe errors inside the loop and only fail after
          # the full 10-minute window with no 200 at all.
          READY=0
          for i in $(seq 1 20); do
            STATUS=$(curl -sI --max-time 20 "$PREVIEW" -o /dev/null -w '%{http_code}' || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "PLAYWRIGHT_BASE_URL=$PREVIEW" >> "$GITHUB_ENV"
              READY=1
              break
            fi
            echo "[$i] preview not ready ($STATUS) — sleeping 30s"; sleep 30
          done
          if [ "$READY" != "1" ]; then
            echo "::error::PR preview $PREVIEW never returned 200 after 10 minutes"
            exit 1
          fi

      - name: Visual diff (advisory)
        id: visual
        if: steps.gate.outputs.have == '1'
        continue-on-error: true
        env:
          VISUAL: "1"
        run: npx playwright test --project=visual --project=visual-mobile

      - name: Upload diff artifacts
        # continue-on-error makes the step succeed at the job level, so use the
        # step's own outcome (not job failure()) to detect a visual mismatch.
        if: steps.gate.outputs.have == '1' && steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          # Only the diff/actual/expected PNGs — what you actually look at for a
          # visual mismatch. Dropping the full playwright-report/ + test-results/
          # (trace .zip, ~180MB each) shrinks this artifact by ~10× and is why
          # visual-diff alone was 11GB of the 15GB that blew the storage quota.
          path: |
            test-results/**/*.png
          # 2d (was 7d): advisory visual mismatches upload often; short retention
          # keeps steady-state storage under the repo quota (2026-07-23 outage).
          retention-days: 2
          if-no-files-found: ignore

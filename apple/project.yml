name: ThePickleHub
options:
  bundleIdPrefix: net.thepicklehub
  # Song ngữ: developmentRegion của pbxproj phải là vi — DEVELOPMENT_LANGUAGE ở
  # settings.base KHÔNG set được nó (bẫy đã ghi trong proposal native-bilingual).
  developmentLanguage: vi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    DEVELOPMENT_LANGUAGE: vi

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: "2.48.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: "9.2.0"
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: "12.9.0"

targets:
  ThePickleHub:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ThePickleHub
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    entitlements:
      path: ThePickleHub/App/ThePickleHub.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:www.thepicklehub.net
          - applinks:thepicklehub.net
        com.apple.developer.applesignin:
          - Default
        aps-environment: $(APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_NAME: ThePickleHub
        DEVELOPMENT_TEAM: 5S49Q7AB7M
        INFOPLIST_FILE: ThePickleHub/App/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        # The shipping Capacitor app supports both iPhone and iPad. App Store
        # updates may not remove a previously supported device family.
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        # Keep first-party Swift warning-free without overriding package flags.
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    dependencies:
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Firebase
        product: FirebaseMessaging

  ThePickleHubTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: ThePickleHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.thepicklehub.app.dev.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"

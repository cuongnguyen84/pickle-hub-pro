# ============================================================================
# edge-blob-watchdog — 2026-07-23 Supabase blob-loss incident
# ----------------------------------------------------------------------------
# Supabase platform intermittently loses edge-function code blobs
# (NOT_FOUND_FUNCTION_BLOB) on project ajvlcamxemgbxduhiqrl — observed 5+
# times 22-23/07 even with the GitHub integration AND Branching disabled.
# GitHub's schedule cron is throttled to ~hourly, so the in-repo backstop
# (uptime-ping.yml) reacts too slowly. This worker probes a canary set
# every 5 minutes and, on any blob-404, fires workflow_dispatch on
# uptime-ping.yml whose "Heal blob-less functions" step redeploys the
# fleet and alerts Telegram.
#
# Secrets (wrangler secret put):
#   GH_DISPATCH_PAT — GitHub PAT with actions:write on cuongnguyen84/pickle-hub-pro
#
# Remove when Supabase confirms the platform fix (support ticket pending).
# ============================================================================
name = "edge-blob-watchdog"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[triggers]
crons = ["*/5 * * * *"]

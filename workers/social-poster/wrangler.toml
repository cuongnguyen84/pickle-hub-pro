# social-poster Cloudflare Worker
#
# Auto-posts new VI news items from `news_items` table to the ThePickleHub
# Facebook Page. Driven by Supabase DB Webhook on news_items (INSERT/UPDATE).
# Also exposes a manual /run endpoint for smoke tests + dry-run preview.
#
# Triggers:
#   - POST /        → Supabase DB webhook payload (auto)
#   - POST /run     → manual trigger (admin); body { news_item_id?, dry_run? }
#                     Requires header X-Auth-Secret: $SOCIAL_POSTER_SECRET.
#   - POST /x/run   → X (Twitter) queue drain; body { post_id?, dry_run? }
#                     Same auth. Publishes hand-approved rows from x_posts and
#                     replies the canonical link ~90s later. See src/x.ts.
#
# Bindings + env required:
#   [vars]
#     SUPABASE_URL                  Supabase project URL
#     SITE_URL                      Frontend canonical (https://www.thepicklehub.net)
#     FB_GRAPH_VERSION              Graph API version (e.g. v20.0)
#     FB_POST_MIN_GAP_MINUTES       Min gap between posts (default 5)
#     FB_POST_WINDOW_VN             Posting window, VN local hours (default 7-21)
#     GEMINI_MODEL                  Gemini model name (e.g. gemini-2.0-flash)
#
#   [secrets] (wrangler secret put)
#     SUPABASE_SERVICE_ROLE_KEY     Reads news_items, upserts fb_post_log.
#     SOCIAL_POSTER_SECRET          Dedicated secret for cron + /run.
#     SOCIAL_POSTER_ADMIN_SECRET    Dedicated secret for manual admin runs.
#     FB_PAGE_ID                    Numeric Page ID, e.g. 100000123456789.
#     FB_PAGE_ACCESS_TOKEN          Long-lived (never-expire) Page token.
#     FB_SECONDARY_PAGE_ACCESS_TOKEN Long-lived token for TA Pickleball.
#     GEMINI_API_KEY                Google AI Studio key (caption generation).
#     X_CLIENT_ID                   X app client id (console.x.com, @thepicklehub).
#     X_CLIENT_SECRET               X app client secret. Both are only used to
#                                   refresh the OAuth2 token stored in the
#                                   x_oauth_tokens table — the access/refresh
#                                   tokens themselves live in Postgres, never here,
#                                   because X rotates the refresh token on use and
#                                   a wrangler secret cannot be rewritten at runtime.
#
# Why a Worker and not a Supabase Edge Function?
#   - Graph API is sometimes flaky from Supabase's Tokyo region; Cloudflare
#     edge routes to FB's nearest POP and is more reliable.
#   - We already run news-fetcher + pro-tour-scraper as Workers; same ops model.
#   - Workers `[placement] mode = "smart"` lets us co-locate with Supabase.

name = "social-poster"
main = "src/index.ts"
compatibility_date = "2026-05-19"
compatibility_flags = ["nodejs_compat"]

[vars]
SUPABASE_URL = "https://ajvlcamxemgbxduhiqrl.supabase.co"
SITE_URL = "https://www.thepicklehub.net"
FB_GRAPH_VERSION = "v20.0"
FB_POST_MIN_GAP_MINUTES = "15"
# Quiet hours: no auto-posts outside 07:00-21:00 VN. The webhook fires when
# news-rewrite creates VI rows (US news = VN night); deferred items are
# drained by the catchup cron next morning. Manual /run with news_item_id
# bypasses this window.
FB_POST_WINDOW_VN = "7-21"
GEMINI_MODEL = "gemini-flash-lite-latest"
FB_SECONDARY_PAGE_ID = "376956272170210"
FB_SECONDARY_START_AT = "2026-07-31T10:04:31Z"
# X pacing. 2-4 posts/day is the playbook target and the X free tier write
# budget is small, so the gap is deliberately much wider than Facebook's.
# No posting window: the X account is English-language and its audience is
# not on Vietnam hours.
X_POST_MIN_GAP_MINUTES = "90"
# Link goes in a reply, not the post body — a bare link in the body suppresses
# reach in the "For you" ranking. Wait long enough that the reply lands after
# the post has been distributed, short enough that early readers still see it.
X_LINK_COMMENT_DELAY_SECONDS = "90"
X_MAX_ATTEMPTS = "3"

[observability]
enabled = true

# Note: NOT using [placement] mode = "smart" — Gemini API has region
# restrictions and was rejecting Tokyo-region calls with FAILED_PRECONDITION
# "User location is not supported". Letting the Worker run on the requester's
# nearest POP avoids the issue at the cost of slightly higher Supabase
# latency (acceptable for this non-time-critical pipeline).

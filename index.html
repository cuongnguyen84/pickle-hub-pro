<!doctype html>
<html lang="vi" data-theme="the-line">
  <head>
    <meta charset="UTF-8" />
    <!-- Single-theme: The Line is the app-wide theme (set here so it applies from
         first paint, no FOUC). Restore the saved light/dark mode before render so
         light-mode users don't flash dark. See docs/theline-migration-plan.md. -->
    <script>
      try { if (localStorage.getItem('tl-theme-mode') === 'light') document.documentElement.setAttribute('data-mode', 'light'); } catch (e) {}
    </script>
    <!-- No maximum-scale, no user-scalable=no. Capping zoom fails WCAG 1.4.4 on
         every page of the site, and it was only ever there to hide a different
         bug: form controls under 16px, which iOS answers by zooming on focus.
         The floor in src/index.css fixes that cause, so the cap is gone.
         `interactive-widget=overlays-content` keeps the keyboard from resizing
         the viewport — unrelated to zoom, and load-bearing for the scroll shells. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content" />
    
    <!-- Google tag (gtag.js) -->
    <script>
      // Defer Google Tag Manager until after first paint.
      // Bot guard 2026-07-08: JS-executing datacenter crawlers (headless
      // Chrome from Boydton/Cheyenne/Des Moines etc.) were ~95% of GA4
      // "users", drowning real traffic. window.gtag stays undefined for
      // them — src/utils/ga.ts already no-ops when gtag is missing.
      if (!(navigator.webdriver || /bot|crawl|spider|headless|lighthouse|slurp|bingpreview/i.test(navigator.userAgent))) {
        window.dataLayer = window.dataLayer || [];
        window.gtag = function(){dataLayer.push(arguments);};
        window.gtag('js', new Date());
        window.gtag('config', 'G-JQG63B6NX0', { send_page_view: false, debug_mode: true });
        var gtagLoaded = false;
        function loadGoogleTag() {
          if (gtagLoaded) return;
          gtagLoaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-JQG63B6NX0';
          document.head.appendChild(s);
        }
        ['pointerdown', 'keydown', 'scroll'].forEach(function (eventName) {
          window.addEventListener(eventName, loadGoogleTag, { once: true, passive: true });
        });
        // A passive visit should reach a stable interactive state before
        // analytics competes for bandwidth. Real interaction still loads it
        // immediately through the listeners above.
        window.setTimeout(loadGoogleTag, 60000);
      }
    </script>

    <!-- Preconnect to critical origins for faster initial load -->
    <!-- The origin below is substituted at build time from VITE_SUPABASE_URL
         (vite.config.ts). Hardcoding the ref here made every staging page load
         open a DNS + TLS connection to production. Do not name a project ref
         in this comment either — the marker is replaced everywhere in the file. -->
    <link rel="preconnect" href="%SUPABASE_ORIGIN%" crossorigin />
    <link rel="dns-prefetch" href="%SUPABASE_ORIGIN%" />
    <!-- Preconnect for Google Drive images (common LCP element source) -->
    <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin />
    <link rel="dns-prefetch" href="https://lh3.googleusercontent.com" />
    <!-- Preload the two primary Geist subsets. Latin+Vietnamese are both
         font-display:swap (a VI-majority site that permanently drops its
         Vietnamese glyphs on slow loads renders "nghề" as "nghê" — measured
         on prod H1s, 2026-08-06); decorative subsets stay optional. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
      href="/fonts/geist-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
      href="/fonts/geist-vietnamese.woff2" />

    <!-- Preserve AdSense ownership verification without putting the ad runtime
         on the critical path of every route. Auto Ads + Ahrefs load on first
         human interaction, or after 60s for a passive reader. -->
    <meta name="google-adsense-account" content="ca-pub-1555585348817758" />
    <script>
      (function () {
        var isAudit = navigator.webdriver || /bot|crawl|spider|headless|lighthouse|slurp|bingpreview/i.test(navigator.userAgent);
        if (isAudit) return;
        var loaded = false;
        function loadThirdParty() {
          if (loaded) return;
          loaded = true;

          if (!document.getElementById('adsbygoogle-js')) {
            var ads = document.createElement('script');
            ads.id = 'adsbygoogle-js';
            ads.async = true;
            ads.crossOrigin = 'anonymous';
            ads.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1555585348817758';
            document.head.appendChild(ads);
          }

          if (!document.getElementById('ahrefs-analytics-js')) {
            var ahrefs = document.createElement('script');
            ahrefs.id = 'ahrefs-analytics-js';
            ahrefs.async = true;
            ahrefs.src = 'https://analytics.ahrefs.com/analytics.js';
            ahrefs.setAttribute('data-key', '6MywJYt95FkvqAAYCgzVCA');
            document.head.appendChild(ahrefs);
          }
        }
        ['pointerdown', 'keydown', 'scroll'].forEach(function (eventName) {
          window.addEventListener(eventName, loadThirdParty, { once: true, passive: true });
        });
        window.setTimeout(loadThirdParty, 60000);
      })();
    </script>
